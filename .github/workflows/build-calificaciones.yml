name: Build Calificaciones APK
on:
  push:
    branches: [ reconstruccion-calificaciones ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reconstruccion-calificaciones
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Calificaciones-APK
          path: reconstruccion-calificaciones/app/build/outputs/apk/debug/app-debug.apk
